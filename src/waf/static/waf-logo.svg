<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 20 L170 50 L170 100 C170 140 135 175 100 185 C65 175 30 140 30 100 L30 50 Z" 
        fill="url(#shieldGrad)" stroke="#1e3a8a" stroke-width="4"/>
  
  <!-- Inner Shield -->
  <path d="M100 35 L155 60 L155 95 C155 130 125 160 100 170 C75 160 45 130 45 95 L45 60 Z" 
        fill="#0f172a" opacity="0.8"/>
  
  <!-- AI Brain Node Network -->
  <g filter="url(#glow)">
    <!-- Central Node -->
    <circle cx="100" cy="90" r="18" fill="url(#aiGrad)" opacity="0.9"/>
    
    <!-- Connected Nodes -->
    <circle cx="70" cy="65" r="8" fill="#0ea5e9" opacity="0.8"/>
    <circle cx="130" cy="65" r="8" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="70" cy="115" r="8" fill="#ec4899" opacity="0.8"/>
    <circle cx="130" cy="115" r="8" fill="#0ea5e9" opacity="0.8"/>
    
    <!-- Connection Lines -->
    <line x1="100" y1="90" x2="70" y2="65" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="90" x2="130" y2="65" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="90" x2="70" y2="115" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="90" x2="130" y2="115" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
    <line x1="70" y1="65" x2="130" y2="65" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>
    <line x1="70" y1="115" x2="130" y2="115" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- WAF Text -->
  <text x="100" y="150" font-family="Arial Black, sans-serif" font-size="28" font-weight="bold" 
        text-anchor="middle" fill="#0ea5e9">WAF</text>
  
  <!-- AI Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold" 
        text-anchor="middle" fill="#8b5cf6">AI-POWERED</text>
</svg>
